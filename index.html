<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f6f3ec">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>妙笔笔记</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 笔记列表 -->
<section id="home" class="screen active">
  <header class="home-bar">
    <h1>妙笔笔记</h1>
    <button id="btnNew" class="primary">＋ 新建笔记</button>
  </header>
  <div id="noteGrid" class="note-grid"></div>
  <p id="emptyTip" class="empty-tip">还没有笔记，点右上角「新建笔记」开始书写</p>
</section>

<!-- 编辑器 -->
<section id="editor" class="screen">
  <header class="toolbar">
    <div class="group">
      <button id="btnBack" class="icon" title="返回列表">‹</button>
      <input id="noteTitle" class="title-input" maxlength="40" placeholder="未命名笔记">
    </div>

    <div class="group tools">
      <button class="tool active" data-tool="pen" title="钢笔">✒️</button>
      <button class="tool" data-tool="highlighter" title="荧光笔">🖍️</button>
      <button class="tool" data-tool="eraser" title="橡皮（按笔画擦除）">🧽</button>
      <button class="tool" data-tool="lasso" title="套索选择">➰</button>
    </div>

    <div class="group colors" id="colors"></div>

    <div class="group">
      <input id="penWidth" type="range" min="1" max="8" step="0.5" value="3" title="笔粗细">
    </div>

    <div class="group">
      <button id="btnUndo" class="icon" title="撤销">↶</button>
      <button id="btnRedo" class="icon" title="重做">↷</button>
    </div>

    <div class="group">
      <button id="btnBeautify" class="magic" title="美化本页笔迹">✨ 笔迹美化</button>
      <button id="btnMagicMenu" class="icon" title="美化设置">⚙</button>
      <button id="btnMore" class="icon" title="更多">⋯</button>
    </div>
  </header>

  <div id="stage" class="stage">
    <canvas id="baseCanvas"></canvas>
    <canvas id="liveCanvas"></canvas>
    <div id="selBox" class="sel-box hidden">
      <div class="sel-actions">
        <button data-act="beautify">✨ 美化</button>
        <button data-act="restore">↺ 原迹</button>
        <button data-act="delete">🗑 删除</button>
      </div>
    </div>
    <div id="zoomTag" class="zoom-tag hidden">100%</div>
  </div>

  <!-- 美化设置面板 -->
  <div id="magicPanel" class="panel hidden">
    <h3>笔迹美化</h3>
    <label class="row"><span>写完自动美化</span><input type="checkbox" id="optAuto" checked></label>
    <label class="row col"><span>美化强度 <b id="strengthVal">80%</b></span>
      <input type="range" id="optStrength" min="0" max="100" value="80"></label>
    <label class="row"><span>横平竖直（拉直笔画）</span><input type="checkbox" id="optStraight" checked></label>
    <label class="row"><span>纠正倾斜</span><input type="checkbox" id="optSlant" checked></label>
    <label class="row"><span>字大小统一、对齐横线</span><input type="checkbox" id="optAlign" checked></label>
    <label class="row"><span>字距均匀</span><input type="checkbox" id="optSpacing" checked></label>
    <label class="row"><span>笔锋效果</span><input type="checkbox" id="optBrush" checked></label>
    <div class="row btns">
      <button id="btnRestoreAll">↺ 本页还原为原始笔迹</button>
    </div>
    <p class="hint">提示：在横线上书写效果最好。用套索圈选可以只美化部分文字。</p>
  </div>

  <!-- 更多菜单 -->
  <div id="morePanel" class="panel hidden">
    <h3>更多</h3>
    <label class="row"><span>手指也能书写</span><input type="checkbox" id="optFinger"></label>
    <label class="row"><span>纸张</span>
      <select id="optPaper">
        <option value="lines">横线</option>
        <option value="grid">方格</option>
        <option value="blank">空白</option>
      </select></label>
    <label class="row"><span>行距</span>
      <select id="optSpacingSize">
        <option value="56">小</option>
        <option value="72">中</option>
        <option value="96">大</option>
      </select></label>
    <div class="row btns">
      <button id="btnExport">导出为图片</button>
      <button id="btnClear" class="danger">清空本页</button>
    </div>
    <p class="hint">用 M-Pencil 书写，手指拖动翻页、双指缩放。</p>
  </div>
</section>

<div id="toast" class="toast hidden"></div>

<script src="js/db.js"></script>
<script src="js/geometry.js"></script>
<script src="js/beautify.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
